services:
  raccoon:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - raccoon-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  raccoon-data:
  redis-data:
